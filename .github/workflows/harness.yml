name: Harness offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.12'
      - uses: extractions/setup-just@v3
      - run: uv sync --project harness --locked
      - run: just harness-check
      - run: just harness-test
      - name: Pack and verify plugin license payload
        run: |
          mkdir -p .qfh-private/license-dist
          npm pack ./harness/dsh-plugin --ignore-scripts --pack-destination .qfh-private/license-dist
          uv run --project harness --locked python scripts/check_licenses.py \
            --plugin-archive .qfh-private/license-dist/qfh-dsh-data-0.1.0.tgz
