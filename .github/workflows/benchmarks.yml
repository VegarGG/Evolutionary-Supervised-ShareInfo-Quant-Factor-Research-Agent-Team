name: Nightly benchmarks
# The Section 18.3 benchmarks (BM-PLANTED and BM-NULL at W1 and through acceptance,
# BM-DECAY, BM-STRATEGY) with their fixed seeds, offline with the scripted LLM; the result
# files are kept as an artifact. Run one at a time on 4 cores they add up to about 90
# minutes.
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.12'
      - uses: extractions/setup-just@v3
      - run: uv sync --locked
      - run: just init-secrets
      - run: uv run --locked python scripts/ci_database.py
        env:
          CI_POSTGRES_PASSWORD: ci-only-disposable-password
      - run: just bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks-${{ github.run_id }}
          path: exports/benchmarks/
          retention-days: 90
