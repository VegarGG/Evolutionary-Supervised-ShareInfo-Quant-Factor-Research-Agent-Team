version: '1'
bind: 127.0.0.1
port: 8765
path: /mcp
request_body_bytes: 1048576
long_poll_seconds: 600
list_default: 200
list_max: 2000
approval_concurrency: 1
# Short-code tokens an owner confirmation may carry (Section 13.5): job, deliverable item
# (factor or strategy), acceptance case and pool entry codes.
confirmation_pattern: '(?<![A-Za-z0-9-])(?:J-[0-9]{4,}|[FS]-[0-9]+|C-[0-9]{4,}|E-[0-9A-Fa-f]{6})(?![A-Za-z0-9])'
downstream_timeout_seconds: 5.0
import_max_bytes: 1048576
import_max_entries: 2000
