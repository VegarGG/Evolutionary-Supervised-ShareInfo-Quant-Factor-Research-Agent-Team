schema_version: '1'
kind: protocol
profile: pilot_industry_v1
revision: 1
owner: evaluation
status: draft
source:
- PLAN_ALIGNMENT.md
- appendix-a-pilot-case-industry-rotation.md A.4
- HYBRID_V1_DEVELOPMENT_PLAN.md 7.7, 7.9, 7.10
parameters:
  universe:
    kind: Shenwan level-1 industries
    count: 31
    label_map_ref: fixtures/pilot/manifests/industry_labels.json
  benchmarks:
    codes:
    - 000300.SH
    - 000905.SH
    - 000852.SH
    primary: 000905.SH
    excluded_from_ranks: true
  cycles:
    weekly: each weekly snapshot
    monthly: last weekly snapshot in completed month
    quarterly: last weekly snapshot in completed quarter; monthly review
  publication: first weekly snapshot on or after cycle completion; weekly same snapshot
  execution: first trading close strictly after publication
  exit: next decision execution close
  immature: retain in ledger; exclude from denominator
  out_of_window: retain in ledger; exclude from denominator
  selection:
    fraction: 0.2
    rounding: ceil
    weighting: equal
    tie_break: original industry name
    bottom_group: long price-index proxy, not executable short
  eligibility:
    fundamental_weight_coverage_monthly_quarterly: 0.6
    min_eligible: 10
    neutral_fill: 0.5
    warmup_ref: original frozen P0 configuration
    paired_eligible_pool_hash_required: true
  quarterly_review:
    moving_average_weeks: 4
    relative_return_weeks: 4
    benchmark_mean:
    - 000905.SH
    - 000852.SH
    replacement_top_fraction: 0.5
    replacement_relative_return_min: 0
    no_replacement: hold
    ranking: quarter-frozen
    weights: reset equal at next close
  costs:
    bps:
    - 0
    - 10
    - 30
    primary_bps: 10
    manual_sensitivity_bps:
    - 0
    - 20
    basis: one-way traded notional
    deduct: before holding return
    drift_weights: true
    initial_traded_notional: 1
    full_replacement_traded_notional: 2
    terminal_liquidation: false
    dividends: false
    slippage: false
    borrowing: false
  primary_metric:
    name: extreme_macro_recall
    definition: mean top and bottom recalls
    sampling_unit: mature matched decision
    primary_cycle: weekly
  secondary_metrics:
  - top_recall
  - bottom_recall
  - rank_ic
  - action_rank_ic
  - three_class_accuracy
  - three_class_balanced_accuracy
  - directional_accuracy_vs_csi500
  - top_return
  - bottom_return
  - equal31_return
  - top_bottom_spread
  - top_excess_csi500
  - top_excess_equal31
  - top_excess_equal31_net_10bps
  - traded_notional
  - one_way_turnover
  bootstrap:
    method: paired circular moving-block percentile
    display:
      draws: 2000
      seed: 20260101
      blocks:
        weekly: 4
        monthly: 2
        quarterly_review: 2
        fixed_quarter: 1
    formal:
      draws: 4000
      seed: 20261020
      blocks:
        weekly: 4
        monthly: 2
        quarterly_review: 3
        fixed_quarter: 1
    confidence: 0.95
    family_comparisons: 12
    family_alpha: 0.05
    small_sample_periods: 10
    small_sample_blocks: 5
  diagnostics:
    placebo_min_shift:
      weekly: 4
      monthly: 2
      quarterly_review: 3
    placebo_percentile_hurdle: 90
    max_pool_correlation: 0.7
    turnover_cap: null
    prefix_cutoffs:
    - '2021-12-31'
    - '2022-05-06'
    - '2023-05-05'
    - '2024-01-05'
    - '2024-07-05'
    - '2024-12-27'
    neighbor_protocol_ref: P1:validation/robustness_protocol.json
  data_policy:
    new_supplier_requests: false
    exposure: previously_seen
    timing: documented availability rule for fundamentals
    vintage: unknown
    membership: backfilled
    fundamental_hypotheses: blocked_on_data
  forward_tracking:
    enabled: false
    missed_signal_dates: replay
    needs_new_observations: waiting_for_data
unresolved:
- Turnover cap and final research-protocol approval are unresolved; original replay
  remains independent.
