          "CMD",
          "python",
          "-c",
          "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz')); assert r['status']=='ok', r"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 30
      },
      "build": {
        "context": "..",
