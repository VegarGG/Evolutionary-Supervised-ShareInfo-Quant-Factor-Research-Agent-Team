        "TZ": "Asia/Shanghai",
        "RESEARCH_DB_URL": "${RESEARCH_DB_URL:?run just init-secrets}",
        "QFR_RESEARCH_SNAPSHOT_DIR": "/data/research",
        "REGISTRY_API_URL": "http://registry-api:8000",
        "FEEDBACK_API_URL": "http://feedback-api:8000",
        "FEEDBACK_READER_TOKEN": "${FEEDBACK_READER_TOKEN:?run just init-secrets}",
        "RESEARCH_CONTROL_TOKEN": "${RESEARCH_CONTROL_TOKEN:?run just init-secrets}",
        "REGISTRY_PUBLISHER_TOKEN": "${REGISTRY_PUBLISHER_TOKEN:?run just init-secrets}",
        "QFR_RESEARCH_BIND": "0.0.0.0"
