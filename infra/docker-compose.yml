{
  "name": "qfr-v2",
  "services": {
    "postgres": {
      "image": "qfr-v2-postgres:phase0",
      "user": "999:999",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=64m,uid=999,gid=999",
        "/var/run/postgresql:rw,nosuid,size=16m,uid=999,gid=999"
      ],
      "environment": {
        "POSTGRES_USER": "postgres",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?run just init-secrets}",
        "POSTGRES_INITDB_ARGS": "--auth-host=scram-sha-256",
        "TZ": "Asia/Shanghai",
        "REGISTRY_PASSWORD": "${REGISTRY_PASSWORD:?run just init-secrets}",
        "RESEARCH_PASSWORD": "${RESEARCH_PASSWORD:?run just init-secrets}",
        "EVAL_PASSWORD": "${EVAL_PASSWORD:?run just init-secrets}",
        "FEEDBACK_PASSWORD": "${FEEDBACK_PASSWORD:?run just init-secrets}",
        "CONTROL_PASSWORD": "${CONTROL_PASSWORD:?run just init-secrets}",
        "REGISTRY_MIGRATION_PASSWORD": "${REGISTRY_MIGRATION_PASSWORD:?run just init-secrets}",
        "RESEARCH_MIGRATION_PASSWORD": "${RESEARCH_MIGRATION_PASSWORD:?run just init-secrets}",
        "EVAL_MIGRATION_PASSWORD": "${EVAL_MIGRATION_PASSWORD:?run just init-secrets}",
        "CONTROL_MIGRATION_PASSWORD": "${CONTROL_MIGRATION_PASSWORD:?run just init-secrets}"
      },
      "volumes": [
        {
          "type": "volume",
          "source": "pg_data",
          "target": "/var/lib/postgresql/data",
          "read_only": false
        }
      ],
      "networks": [
        "control_net",
        "research_net",
        "registry_net",
        "eval_net"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 30
      },
      "deploy": {
        "resources": {
          "limits": {
            "cpus": "4",
            "memory": "8G"
          }
        }
      },
      "build": {
        "context": "..",
        "dockerfile": "infra/Dockerfile",
        "target": "postgres"
      },
      "platform": "${QFR_PLATFORM:-linux/arm64}"
    },
    "qfr-mcp": {
      "user": "10001:10001",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"
      ],
      "restart": "no",
      "deploy": {
        "resources": {
          "limits": {
            "cpus": "1",
            "memory": "1G"
          }
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8765/mcp',data=b'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ping\"}',headers={'Authorization':'Bearer '+os.environ['QFR_MCP_TOKEN'],'Content-Type':'application/json','Accept':'application/json, text/event-stream'}); urllib.request.urlopen(r).read()"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 30
      },
      "build": {
        "context": "..",
        "dockerfile": "infra/Dockerfile",
        "target": "mcp",
        "args": {
          "QFR_PACKAGE": "qfr-mcp"
        }
      },
      "image": "qfr-v2-mcp:phase2",
      "platform": "${QFR_PLATFORM:-linux/arm64}",
      "environment": {
        "QFR_ENV": "prod",
        "QFR_SERVICE": "qfr-mcp",
        "QFR_ZONE": "control",
        "TZ": "Asia/Shanghai",
        "QFR_MCP_BIND": "0.0.0.0",
        "QFR_MCP_TOKEN": "${QFR_MCP_TOKEN:?run just init-secrets}",
        "CONTROL_DB_URL": "${CONTROL_DB_URL:?run just init-secrets}",
        "REGISTRY_CONTROL_TOKEN": "${REGISTRY_CONTROL_TOKEN:?run just init-secrets}",
        "RESEARCH_CONTROL_TOKEN": "${RESEARCH_CONTROL_TOKEN:?run just init-secrets}",
        "EVAL_OWNER_TOKEN": "${EVAL_OWNER_TOKEN:?run just init-secrets}",
        "FEEDBACK_READER_TOKEN": "${FEEDBACK_READER_TOKEN:?run just init-secrets}",
        "REGISTRY_API_URL": "http://registry-api:8000",
        "RESEARCH_API_URL": "http://research-api:8000",
        "EVAL_ADMIN_API_URL": "http://eval-admin-api:8000",
        "FEEDBACK_API_URL": "http://feedback-api:8000",
        "QFR_IMPORTS_DIR": "/imports",
        "QFR_EXPORTS_DIR": "/exports",
        "QFR_OWNER_EVIDENCE_SCHEMA": "/app/schemas/owner_evidence.json"
      },
      "volumes": [
        {
          "type": "volume",
          "source": "qfr_logs",
          "target": "/var/log/qfr",
          "read_only": true
        },
        {
          "type": "volume",
          "source": "qfr_logs",
          "target": "/var/log/qfr/qfr-mcp",
          "read_only": false,
          "volume": {
            "subpath": "qfr-mcp"
          }
        },
        {
          "type": "bind",
          "source": "../imports",
          "target": "/imports",
          "read_only": true
        },
        {
          "type": "bind",
          "source": "../exports",
          "target": "/exports",
          "read_only": false
        }
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "init-volumes": {
          "condition": "service_completed_successfully"
        },
        "migrate": {
          "condition": "service_completed_successfully"
        },
        "registry-api": {
          "condition": "service_started"
        }
      },
      "networks": [
        "control_net",
        "mcp_ingress_net"
      ],
      "command": [
        "python",
        "-m",
        "qfr_mcp.server"
      ],
      "ports": [
        "127.0.0.1:8765:8765"
      ]
    },
    "research-api": {
      "user": "10001:10001",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
