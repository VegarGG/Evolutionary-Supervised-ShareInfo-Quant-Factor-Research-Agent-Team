- id: llm-deepseek
  disabled: true
- id: llm-retry
  disabled: true
- insert:
    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          zai-coding-cn:
            apiKeyEnv: ZAI_CODING_CN_API_KEY
            api: openai-completions
            baseURL: !!js process.env.QFH_RELAY_URL
            retryPolicy: {mode: normal, maxRetries: 0}
            headers:
              x-qfh-relay-key: !!js process.env.QFH_RELAY_CREDENTIAL
              x-qfh-session-id: !!js process.env.QFH_MODULE_STEP
            models:
              - id: glm-5.3-flash
                contextWindow: 1048576
                maxTokens: !!js Number(process.env.QFH_MAX_TOKENS)
                input: [text]
