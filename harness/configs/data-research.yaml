# Keep the three historical BaoStock attempts, including both failures.
# Authorize ONE new bounded query for the integration/owner trials; reuse it thereafter.
# Paid-source limits are unchanged, and the research-trial profile allows BaoStock only.
max_business_requests: 1
max_auth_requests: 1
max_calendar_days: 3
max_symbols: 1
max_estimated_cells: 3
max_response_bytes: 1048576
timeout_seconds: 30
allowed_kinds: [bars]
research_cutoff: '2026-10-30T23:59:59.999999+08:00'
provider_allowances:
  baostock:
    max_business_requests: 4
    max_auth_requests: 4
    max_estimated_cells: 21
    max_calendar_days: 12
    max_symbols: 1
