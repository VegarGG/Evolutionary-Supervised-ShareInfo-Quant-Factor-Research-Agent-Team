  Develop an executable short-horizon close-momentum hypothesis for later independent
  evaluation on this new frozen A-share sample. Start from the five-observation raw
  return. Identify source-supported applicability constraints and motivate at most
  one alternative specification using the observed price/return profiles. Inspect
