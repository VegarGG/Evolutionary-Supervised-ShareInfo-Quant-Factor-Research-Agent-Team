research_contract: >-
  This is exploratory hypothesis development, with no forward performance labels.
  Distinguish three decisions: inspect a motivated hypothesis; adopt or retain a
  research candidate with explicit assumptions; and demonstrate investment benefit
  in a separate future evaluation. Only the first two are in scope. Descriptive
  score differences cannot establish superiority. Compare coverage and score-scale
  consequences against the baseline; justify any added parameter or applicability
  exclusion from cited evidence and state what evidence would be needed next.
  A coherent retention or inconclusive proposal is allowed. Never manufacture a
  correction to satisfy a checkpoint, infer corporate actions from close-only jumps,
  or describe a volatility-scaled score as an annual Sharpe ratio.
