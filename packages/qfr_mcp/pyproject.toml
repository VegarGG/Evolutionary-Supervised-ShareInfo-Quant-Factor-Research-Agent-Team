[project]
name = "qfr-mcp"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["qfr-core", "mcp>=1.20,<2", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "jsonschema>=4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
qfr-core = {workspace = true}

[project.scripts]
qfr-mcp = "qfr_mcp.server:main"
