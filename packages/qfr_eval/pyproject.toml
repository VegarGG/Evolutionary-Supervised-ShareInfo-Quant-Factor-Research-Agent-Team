[project]
name = "qfr-eval"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "ADDITIONAL-PERMISSION.md", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = ["qfr-core", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "typer>=0.15,<1", "SQLAlchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
qfr-core = {workspace = true}

[project.entry-points."qfr.commands"]
data = "qfr_eval.ingest.cli:app"
eval = "qfr_eval.reproduce:app"
