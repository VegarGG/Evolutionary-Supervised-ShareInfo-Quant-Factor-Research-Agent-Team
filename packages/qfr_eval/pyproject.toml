[project]
name = "qfr-eval"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "ADDITIONAL-PERMISSION.md", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "qfr-core",
    "alembic",
    "psycopg[binary]",
    "threadpoolctl==3.6.0",
    "fastapi",
    "uvicorn",
]

[project.scripts]
qfr = "qfr_eval.cli:main"
qfr-eval-admin = "qfr_eval.admin.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qfr_eval"]
