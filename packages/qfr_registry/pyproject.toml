[project]
name = "qfr-registry"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["qfr-core", "alembic", "psycopg[binary]", "fastapi", "uvicorn"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qfr_registry"]
