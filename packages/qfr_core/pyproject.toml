[project]
name = "qfr-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3", "pydantic-settings>=2.8,<3", "PyYAML>=6,<7", "structlog>=25,<27", "typer>=0.15,<1", "polars>=1.30,<2", "numpy>=2.2,<3", "lark>=1.2,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
qfr = "qfr_core.cli:app"
