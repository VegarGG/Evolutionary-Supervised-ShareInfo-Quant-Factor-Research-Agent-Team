[project]
name = "qfr-core"
version = "0.0.1"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "ADDITIONAL-PERMISSION.md", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3", "pydantic-settings>=2.8,<3", "PyYAML>=6,<7", "structlog>=25,<27", "typer>=0.15,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.scripts]
qfr = "qfr_core.cli:app"
