[project]
name = "qfr-research"
version = "0.0.1"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "ADDITIONAL-PERMISSION.md", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = ["qfr-core", "fastapi>=0.115,<1", "SQLAlchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "pydantic-ai-slim[openai]>=2.63,<3", "typer>=0.15,<1"]

[project.entry-points."qfr.commands"]
llm = "qfr_research.cli:llm_app"
trace = "qfr_research.cli:trace_app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
qfr-core = {workspace = true}
