[project]
name = "qfr-research"
version = "0.0.1"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = ["qfr-core", "fastapi>=0.115,<1", "SQLAlchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
qfr-core = {workspace = true}
